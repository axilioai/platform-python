asyncapi: 3.0.0
info:
  title: Axilio Device Control Protocol (DCP)
  version: '1'
  x-dcp-protocol-version: 1
  description: 'The wire beneath the SDK''s RemoteTransport: literal CDP framing - `{id, method, params}`
    commands answered by `{id, result | error}` - over one authenticated WebSocket per allocation. Every
    executor implements Protocol.handshake, so a client that calls it treats an error (including UnknownOp)
    as a real failure. Timestamps are epoch-milliseconds. Frames carry no in-frame sequence number: the
    reconnect/resume cursor is a transport-level stream position, delivered below the frame as the opt-in
    `Axilio.cursor` notification and presented back on reattach as the `cursor` query param. The only
    notification methods emitted today are the two Axilio.* transport notifications.'
servers:
  connect:
    host: connect.axilio.ai
    protocol: wss
    description: Realtime hub. Clients attach at the control_url minted by allocate.
channels:
  control:
    address: /api/v1/realtime/ws/control
    description: 'The per-allocation control socket. Every frame is one of the three envelopes below;
      the hub relays bytes verbatim in both directions. Optional attach-time query params: resume=1 opts
      in to Axilio.cursor checkpoints; cursor=<entry ID> resumes delivery strictly after that checkpoint
      (at-least-once: frames after the last checkpoint redeliver). Without them the socket behaves exactly
      as before: delivery starts at the stream tail and no transport notification is ever injected. Reattach
      HTTP status is the out-of-band liveness signal: 403 means the allocation is no longer ACTIVE (terminal),
      401 means the token is bad.

      '
    messages:
      command:
        $ref: '#/components/messages/command'
      response:
        $ref: '#/components/messages/response'
      notification:
        $ref: '#/components/messages/notification'
operations:
  sendCommand:
    action: send
    channel:
      $ref: '#/channels/control'
    messages:
    - $ref: '#/channels/control/messages/command'
    description: 'Client → device. Commands are id-correlated and processed sequentially on the device.

      '
  receiveReplies:
    action: receive
    channel:
      $ref: '#/channels/control'
    messages:
    - $ref: '#/channels/control/messages/response'
    - $ref: '#/channels/control/messages/notification'
    description: 'Device → client. Responses echo the command id. Notification frames are id-less; the
      only ones emitted today are the opt-in Axilio.* transport notifications. Device-event notifications
      arrive with the telemetry up-channel.

      '
components:
  messages:
    command:
      name: command
      x-dcp-kind: envelope
      payload:
        type: object
        additionalProperties: false
        required:
        - id
        - method
        properties:
          id:
            type: integer
            format: int64
            description: Monotonic per connection; the response echoes it.
          method:
            type: string
            description: One of the command methods below (Domain.method).
          params:
            type: object
            description: Method-specific arguments; see x-dcp-params per method.
    response:
      name: response
      x-dcp-kind: envelope
      payload:
        type: object
        additionalProperties: false
        required:
        - id
        properties:
          id:
            type: integer
            format: int64
          result:
            type: object
            description: Present on success (at least {}). See x-dcp-result per method.
          error:
            $ref: '#/components/schemas/DcpError'
    notification:
      name: notification
      x-dcp-kind: envelope
      payload:
        type: object
        additionalProperties: false
        required:
        - method
        properties:
          method:
            type: string
            description: One of the notification methods (the Axilio.* transport notifications below).
          params:
            type: object
    Protocol.handshake:
      name: Protocol.handshake
      x-dcp-kind: command
      description: 'Optional, on socket open. The server does not enforce min_protocol — skew stays client-decided;
        unknown methods answer UnknownOp.

        '
      x-dcp-params:
        $ref: '#/components/schemas/HandshakeParams'
      x-dcp-result:
        $ref: '#/components/schemas/HandshakeResult'
    Device.info:
      name: Device.info
      x-dcp-kind: command
      description: Static device descriptor for gesture sizing without a screenshot round trip.
      x-dcp-params:
        type: object
      x-dcp-result:
        $ref: '#/components/schemas/DeviceInfo'
    Touch.tap:
      name: Touch.tap
      x-dcp-kind: command
      x-dcp-params:
        $ref: '#/components/schemas/TouchTapParams'
      x-dcp-result:
        type: object
    Touch.longPress:
      name: Touch.longPress
      x-dcp-kind: command
      x-dcp-params:
        $ref: '#/components/schemas/TouchLongPressParams'
      x-dcp-result:
        type: object
    Touch.swipe:
      name: Touch.swipe
      x-dcp-kind: command
      x-dcp-params:
        $ref: '#/components/schemas/TouchSwipeParams'
      x-dcp-result:
        type: object
    Keyboard.typeText:
      name: Keyboard.typeText
      x-dcp-kind: command
      x-dcp-params:
        $ref: '#/components/schemas/KeyboardTypeTextParams'
      x-dcp-result:
        type: object
    Keyboard.keyPress:
      name: Keyboard.keyPress
      x-dcp-kind: command
      description: 'key is one of the deployed named keys: "enter" or "capslock". Printable text is sent
        with Keyboard.typeText, not as a key press. usage is a legacy numeric key code kept for SDKs pinned
        before the named-key protocol; when key is present it takes precedence and usage is ignored.

        '
      x-dcp-params:
        $ref: '#/components/schemas/KeyboardKeyPressParams'
      x-dcp-result:
        type: object
    Screen.screenshot:
      name: Screen.screenshot
      x-dcp-kind: command
      x-dcp-params:
        type: object
      x-dcp-result:
        $ref: '#/components/schemas/ScreenshotResult'
    Screen.observe:
      name: Screen.observe
      x-dcp-kind: command
      x-dcp-params:
        $ref: '#/components/schemas/ObserveParams'
      x-dcp-result:
        $ref: '#/components/schemas/ObserveResult'
    Locator.tap:
      name: Locator.tap
      x-dcp-kind: command
      description: 'Resolve the locator on the current screen, wait until the target is actionable (present
        and not moving), then tap its centre, all on the device in one round trip. Fails with ActionTimeout
        when the target never becomes actionable within timeoutMs.

        '
      x-dcp-params:
        $ref: '#/components/schemas/LocatorTapParams'
      x-dcp-result:
        $ref: '#/components/schemas/LocatorResult'
    Locator.fill:
      name: Locator.fill
      x-dcp-kind: command
      description: 'Resolve and wait as Locator.tap, focus the target by tapping it, then type text into
        it.

        '
      x-dcp-params:
        $ref: '#/components/schemas/LocatorFillParams'
      x-dcp-result:
        $ref: '#/components/schemas/LocatorResult'
    Locator.press:
      name: Locator.press
      x-dcp-kind: command
      description: 'Press a named key. With a locator, the target is resolved, waited for and focused
        first; without one, the key goes to whatever has focus.

        '
      x-dcp-params:
        $ref: '#/components/schemas/LocatorPressParams'
      x-dcp-result:
        $ref: '#/components/schemas/LocatorPressResult'
    Locator.waitFor:
      name: Locator.waitFor
      x-dcp-kind: command
      description: 'Block on the device until the locator reaches the requested state (visible by default),
        re-resolving against each fresh frame. One call replaces a client-side polling loop.

        '
      x-dcp-params:
        $ref: '#/components/schemas/LocatorWaitForParams'
      x-dcp-result:
        $ref: '#/components/schemas/LocatorWaitForResult'
    Locator.boundingBox:
      name: Locator.boundingBox
      x-dcp-kind: command
      description: Wait until the locator resolves, then return the target's bounds.
      x-dcp-params:
        $ref: '#/components/schemas/LocatorQueryParams'
      x-dcp-result:
        $ref: '#/components/schemas/LocatorResult'
    Locator.text:
      name: Locator.text
      x-dcp-kind: command
      description: Wait until the locator resolves, then return the target's text.
      x-dcp-params:
        $ref: '#/components/schemas/LocatorQueryParams'
      x-dcp-result:
        $ref: '#/components/schemas/LocatorTextResult'
    Locator.count:
      name: Locator.count
      x-dcp-kind: command
      description: 'Count the targets matching the locator on the current screen, zero included. Never
        waits.

        '
      x-dcp-params:
        $ref: '#/components/schemas/LocatorCountParams'
      x-dcp-result:
        $ref: '#/components/schemas/LocatorCountResult'
    Axilio.cursor:
      name: Axilio.cursor
      x-dcp-kind: notification
      description: 'Cursor checkpoint. Emitted once per delivered stream batch, after the batch''s last
        frame, and only when the client attached with resume=1. The cursor is opaque: track the latest
        value and present it back on reattach; never parse it.

        '
      x-dcp-params:
        $ref: '#/components/schemas/CursorParams'
    Axilio.resyncRequired:
      name: Axilio.resyncRequired
      x-dcp-kind: notification
      description: 'Expired-window signal. Sent as the first frame of a reattach whose cursor predates
        the oldest retained stream entry (trim or TTL took part of the gap), then the socket continues
        live. The client''s world model is stale: re-observe. Only ever sent to a client that presented
        a cursor.

        '
      x-dcp-params:
        $ref: '#/components/schemas/ResyncRequiredParams'
  schemas:
    CursorParams:
      type: object
      required:
      - cursor
      properties:
        cursor:
          type: string
          description: 'The hub''s stream entry ID for the last frame delivered before this checkpoint.
            Opaque; present verbatim as the cursor query param on reattach.

            '
    ResyncRequiredParams:
      type: object
      required:
      - requested
      properties:
        requested:
          type: string
          description: The cursor the client presented.
        oldest:
          type: string
          description: 'The oldest entry still retained; absent when the stream held nothing. Informational
            only.

            '
    HandshakeParams:
      type: object
      properties:
        client_version:
          type: string
        min_protocol:
          type: integer
    TouchTapParams:
      type: object
      required:
      - x
      - y
      properties:
        x:
          type: integer
        y:
          type: integer
        idempotencyKey:
          $ref: '#/components/schemas/IdempotencyKey'
    TouchLongPressParams:
      type: object
      required:
      - x
      - y
      properties:
        x:
          type: integer
        y:
          type: integer
        duration_ms:
          type: integer
        idempotencyKey:
          $ref: '#/components/schemas/IdempotencyKey'
    TouchSwipeParams:
      type: object
      required:
      - x1
      - y1
      - x2
      - y2
      properties:
        x1:
          type: integer
        y1:
          type: integer
        x2:
          type: integer
        y2:
          type: integer
        duration_ms:
          type: integer
        idempotencyKey:
          $ref: '#/components/schemas/IdempotencyKey'
    KeyboardTypeTextParams:
      type: object
      required:
      - text
      properties:
        text:
          type: string
        idempotencyKey:
          $ref: '#/components/schemas/IdempotencyKey'
    KeyboardKeyPressParams:
      type: object
      properties:
        usage:
          type: integer
        key:
          type: string
          enum:
          - enter
          - capslock
        idempotencyKey:
          $ref: '#/components/schemas/IdempotencyKey'
    IdempotencyKey:
      type: string
      description: 'Optional client-generated key that makes re-send safe. The executor keeps a per-allocation
        key-to-recorded-response ledger: a duplicate key returns the recorded response (re-correlated
        to the new request id) without executing again. Unique per logical command; reuse it verbatim
        only when re-sending that same command after a reconnect. Mutating input methods only (Touch,
        Keyboard, and Locator.tap, fill and press); reads are keyless.

        '
    ObserveParams:
      type: object
      properties:
        ocr_engine:
          type: string
    Locator:
      type: object
      description: 'A target on the screen. All fields are optional and combine as AND. role, name, id,
        states and platform assume the accessibility tree and answer StrategyUnavailable when the session
        has none, whatever the strategy. text matches visible text, against the tree when accessibility
        is on and OCR when it is off. query is natural language: a model ranks the tree''s elements by
        default, and the VLM reads the screen under strategy vision or when there is no tree. A literal
        selector that matches nothing fails after the auto-wait. within (inside a match), has (containing
        a match) and nth refine the base match. platform is native matching and is not portable.

        '
      properties:
        role:
          type: string
          description: Accessibility role, e.g. "button", "textbox".
        name:
          type: string
          description: Accessible name.
        text:
          type: string
          description: Visible text; substring and case-insensitive unless exact is true.
        exact:
          type: boolean
        id:
          type: string
          description: Developer-assigned id, e.g. an Android resource id "com.example.app:id/save".
        states:
          type: array
          items:
            type: string
          description: Required element states, e.g. ["checked"]. Accessibility tree only.
        query:
          type: string
          description: Natural-language description of the target.
        within:
          $ref: '#/components/schemas/Locator'
        has:
          $ref: '#/components/schemas/Locator'
        nth:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Pick the nth match in reading order, zero-based.
        platform:
          $ref: '#/components/schemas/LocatorPlatform'
    LocatorPlatform:
      type: object
      description: Per-platform native matching. Not portable across device classes.
      properties:
        android:
          $ref: '#/components/schemas/AndroidLocator'
    AndroidLocator:
      type: object
      properties:
        className:
          type: string
          description: Android view class, e.g. "android.widget.Button".
    LocatorStrategy:
      type: string
      enum:
      - auto
      - vision
      - accessibility
      description: 'Which resolver to use. auto (the default) uses the accessibility tree when the session
        has it and the screen otherwise; vision always uses the screen; accessibility always uses the
        tree. Selectors that need the tree answer StrategyUnavailable without it.

        '
    LocatorTimeoutMs:
      type: integer
      minimum: 0
      maximum: 60000
      default: 5000
      description: 'Budget for the whole call in milliseconds, auto-wait included. Omitted or 0 means
        the default. An inference already running when the budget ends is allowed to finish. On expiry
        the call fails with ActionTimeout.

        '
    LocatorOcrEngine:
      type: string
      description: 'OCR tier for the vision resolver ("free" or "premium"), as on Screen.observe. Omitted
        means the default.

        '
    LocatorModel:
      type: string
      description: 'Model pin for the model-backed resolvers: the VLM under vision, and the model a natural-language
        query is ranked with over the accessibility tree. Omitted means the default.

        '
    ResolvedBy:
      type: string
      enum:
      - a11y
      - ocr
      - vlm
      description: How the target was resolved.
    LocatorTapParams:
      type: object
      required:
      - locator
      properties:
        locator:
          $ref: '#/components/schemas/Locator'
        strategy:
          $ref: '#/components/schemas/LocatorStrategy'
        timeoutMs:
          $ref: '#/components/schemas/LocatorTimeoutMs'
        ocrEngine:
          $ref: '#/components/schemas/LocatorOcrEngine'
        model:
          $ref: '#/components/schemas/LocatorModel'
        idempotencyKey:
          $ref: '#/components/schemas/IdempotencyKey'
    LocatorFillParams:
      type: object
      required:
      - locator
      - text
      properties:
        locator:
          $ref: '#/components/schemas/Locator'
        text:
          type: string
        strategy:
          $ref: '#/components/schemas/LocatorStrategy'
        timeoutMs:
          $ref: '#/components/schemas/LocatorTimeoutMs'
        ocrEngine:
          $ref: '#/components/schemas/LocatorOcrEngine'
        model:
          $ref: '#/components/schemas/LocatorModel'
        idempotencyKey:
          $ref: '#/components/schemas/IdempotencyKey'
    LocatorPressParams:
      type: object
      required:
      - key
      properties:
        locator:
          $ref: '#/components/schemas/Locator'
        key:
          type: string
          enum:
          - enter
          - capslock
        strategy:
          $ref: '#/components/schemas/LocatorStrategy'
        timeoutMs:
          $ref: '#/components/schemas/LocatorTimeoutMs'
        ocrEngine:
          $ref: '#/components/schemas/LocatorOcrEngine'
        model:
          $ref: '#/components/schemas/LocatorModel'
        idempotencyKey:
          $ref: '#/components/schemas/IdempotencyKey'
    LocatorWaitForParams:
      type: object
      required:
      - locator
      properties:
        locator:
          $ref: '#/components/schemas/Locator'
        state:
          type: string
          enum:
          - visible
          - hidden
          - enabled
          description: 'The state to wait for; visible by default. enabled needs the accessibility tree
            (vision cannot tell).

            '
        strategy:
          $ref: '#/components/schemas/LocatorStrategy'
        timeoutMs:
          $ref: '#/components/schemas/LocatorTimeoutMs'
        ocrEngine:
          $ref: '#/components/schemas/LocatorOcrEngine'
        model:
          $ref: '#/components/schemas/LocatorModel'
    LocatorQueryParams:
      type: object
      required:
      - locator
      properties:
        locator:
          $ref: '#/components/schemas/Locator'
        strategy:
          $ref: '#/components/schemas/LocatorStrategy'
        timeoutMs:
          $ref: '#/components/schemas/LocatorTimeoutMs'
        ocrEngine:
          $ref: '#/components/schemas/LocatorOcrEngine'
        model:
          $ref: '#/components/schemas/LocatorModel'
    LocatorCountParams:
      type: object
      required:
      - locator
      properties:
        locator:
          $ref: '#/components/schemas/Locator'
        strategy:
          $ref: '#/components/schemas/LocatorStrategy'
        ocrEngine:
          $ref: '#/components/schemas/LocatorOcrEngine'
        model:
          $ref: '#/components/schemas/LocatorModel'
    HandshakeResult:
      type: object
      required:
      - protocol_version
      - device
      - domains
      - capabilities
      properties:
        protocol_version:
          type: integer
        device:
          $ref: '#/components/schemas/DeviceInfo'
        domains:
          type: array
          uniqueItems: true
          items:
            type: string
          description: 'The capability-profile set this device advertises (the domain prefixes of capabilities),
            sorted and de-duplicated — e.g. ["Device", "Keyboard", "Protocol", "Screen", "Touch"] for
            a phone.

            '
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
          description: The exact method-name set this server answers, sorted.
    ScreenshotResult:
      type: object
      required:
      - png_base64
      properties:
        png_base64:
          type: string
          description: Base64-encoded PNG.
    ObserveResult:
      type: object
      required:
      - texts
      - icons
      - hash
      - width
      - height
      - captured_at
      properties:
        texts:
          type: array
          items:
            $ref: '#/components/schemas/ObserveText'
        icons:
          type: array
          items:
            $ref: '#/components/schemas/ObserveIcon'
        hash:
          type: string
        width:
          type: integer
        height:
          type: integer
        captured_at:
          type: integer
          format: int64
          description: Frame timestamp, epoch-ms.
    ObserveText:
      type: object
      properties:
        text:
          type: string
        bbox:
          $ref: '#/components/schemas/Bbox'
        confidence:
          type: number
    ObserveIcon:
      type: object
      properties:
        bbox:
          $ref: '#/components/schemas/Bbox'
        confidence:
          type: number
    LocatorResult:
      type: object
      required:
      - resolvedBy
      - bounds
      - tookMs
      description: 'bounds is where the target was when the device acted, in the pixel space the Touch
        methods address.

        '
      properties:
        resolvedBy:
          $ref: '#/components/schemas/ResolvedBy'
        bounds:
          $ref: '#/components/schemas/Bbox'
        tookMs:
          type: integer
          format: int64
          description: End-to-end time on the device, auto-wait included.
        modelName:
          type: string
          description: The model that resolved the target when resolvedBy is vlm.
    LocatorPressResult:
      type: object
      required:
      - tookMs
      properties:
        resolvedBy:
          $ref: '#/components/schemas/ResolvedBy'
        bounds:
          $ref: '#/components/schemas/Bbox'
        tookMs:
          type: integer
          format: int64
        modelName:
          type: string
          description: The model that resolved the target when resolvedBy is vlm.
      description: resolvedBy and bounds are present only when the press carried a locator.
    LocatorWaitForResult:
      type: object
      required:
      - tookMs
      properties:
        resolvedBy:
          $ref: '#/components/schemas/ResolvedBy'
        bounds:
          $ref: '#/components/schemas/Bbox'
        tookMs:
          type: integer
          format: int64
        modelName:
          type: string
          description: The model that resolved the target when resolvedBy is vlm.
      description: resolvedBy and bounds describe the target that satisfied the wait; absent for state
        hidden.
    LocatorTextResult:
      type: object
      required:
      - text
      - resolvedBy
      - bounds
      - tookMs
      properties:
        text:
          type: string
        resolvedBy:
          $ref: '#/components/schemas/ResolvedBy'
        bounds:
          $ref: '#/components/schemas/Bbox'
        tookMs:
          type: integer
          format: int64
        modelName:
          type: string
          description: The model that resolved the target when resolvedBy is vlm.
    LocatorCountResult:
      type: object
      required:
      - count
      - resolvedBy
      - tookMs
      properties:
        count:
          type: integer
          minimum: 0
        resolvedBy:
          $ref: '#/components/schemas/ResolvedBy'
        tookMs:
          type: integer
          format: int64
        modelName:
          type: string
          description: The model that resolved the target when resolvedBy is vlm.
    DeviceInfo:
      type: object
      required:
      - device_id
      - platform
      - form_factor
      - input_modalities
      - screen_width
      - screen_height
      properties:
        device_id:
          type: string
        platform:
          type: string
          description: OS family — "android" today.
        form_factor:
          type: string
          description: Physical class — "phone" today.
        input_modalities:
          type: array
          items:
            type: string
          description: 'Interaction classes the device accepts — ["touch", "keyboard"] for a phone. A
            client sizes behavior from this, not from platform.

            '
        model:
          type: string
          description: Best-effort; empty when the descriptor lookup has not succeeded.
        os_version:
          type: string
          description: Best-effort; empty when unknown.
        screen_width:
          type: integer
        screen_height:
          type: integer
    Bbox:
      type: object
      required:
      - x
      - y
      - width
      - height
      properties:
        x:
          type: integer
        y:
          type: integer
        width:
          type: integer
        height:
          type: integer
    DcpError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            kind:
              type: string
            retryable:
              type: boolean
x-dcp-error-table:
  UnknownOp:
    code: -32601
    retryable: false
  InvalidArgs:
    code: -32602
    retryable: false
  Internal:
    code: -32603
    retryable: false
  NoAllocation:
    code: -32001
    retryable: false
  NotConnected:
    code: -32002
    retryable: false
  DeviceOffline:
    code: -32004
    retryable: true
  Timeout:
    code: -32006
    retryable: true
  Unauthorized:
    code: -32007
    retryable: false
  Canceled:
    code: -32008
    retryable: false
  ActionTimeout:
    code: -32009
    retryable: false
  StrategyUnavailable:
    code: -32010
    retryable: false
