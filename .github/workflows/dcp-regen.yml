name: DCP Regenerate

# Fires when the backend publishes a new production DCP contract, and
# regenerates the DCP typed wire layer (src/axilio/drivers/mobile/_wire.py)
# from it. The DCP twin of the Fern regen.yml, for the WebSocket protocol
# instead of the REST spec.
#
# The backend's production deploy sends a dcp-contract-updated
# repository_dispatch carrying the sanitized, public-safe contract (base64).
# This workflow writes it to contracts/dcp-asyncapi.yaml, reruns the generator,
# and opens a regen PR for a human to review and merge. Merging does NOT cut a
# release: the axilio package owns its own SemVer, bumped deliberately.
#
# Staging dispatches are ignored: staging may carry unreleased wire surface a
# customer must not get types for. A manual run regenerates from the contract
# already committed here.

on:
  repository_dispatch:
    types: [dcp-contract-updated]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    name: Regenerate DCP wire layer
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'dcp-contract-updated' &&
       github.event.client_payload.environment == 'production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write the published contract
        # Only on a dispatch: decode the contract from the payload into the
        # vendored path. A manual run skips this and regenerates from whatever
        # contract is already committed.
        if: github.event.client_payload.contract_b64 != ''
        env:
          CONTRACT_B64: ${{ github.event.client_payload.contract_b64 }}
        run: printf '%s' "$CONTRACT_B64" | base64 -d > contracts/dcp-asyncapi.yaml

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Regenerate the wire layer
        # The generator reads contracts/dcp-asyncapi.yaml and rewrites
        # src/axilio/drivers/mobile/_wire.py. It needs pyyaml (dev extra) and
        # calls uvx for datamodel-code-generator; both come from uv.
        run: |
          uv sync --extra dev
          uv run python scripts/generate_dcp_wire.py

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet contracts/dcp-asyncapi.yaml src/axilio/drivers/mobile/_wire.py; then
            echo "DCP wire layer unchanged; nothing to PR."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected; opening PR."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open regen PR
        if: steps.diff.outputs.changed == 'true'
        # Single reused branch so successive dispatches update one PR rather
        # than stacking duplicates. The regen does NOT bump the SDK version.
        uses: peter-evans/create-pull-request@v6
        env:
          AXILIO_SHA: ${{ github.event.client_payload.axilio_sha || 'manual' }}
        with:
          branch: dcp-regen
          base: main
          add-paths: |
            contracts/dcp-asyncapi.yaml
            src/axilio/drivers/mobile/_wire.py
          title: "chore(dcp): regenerate DCP wire layer"
          commit-message: |
            chore(dcp): regenerate DCP wire layer

            Auto-generated by .github/workflows/dcp-regen.yml from the published
            DCP contract (axilio@${{ github.event.client_payload.axilio_sha || 'manual' }}).
          body: |
            The backend published a DCP contract change (protocol `${{ github.event.client_payload.protocol_version }}`, contract `${{ github.event.client_payload.contract_version }}`).

            This regenerates `src/axilio/drivers/mobile/_wire.py` from the updated `contracts/dcp-asyncapi.yaml`. Review the diff and merge. The wire drift test (`tests/test_dcp_wire_drift.py`) runs in CI and must pass. Merging does not cut a release.
          labels: dcp-regen
